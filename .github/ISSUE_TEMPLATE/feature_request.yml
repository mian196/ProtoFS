name: 💡 Feature Request
description: Propose a new feature, enhancement, or idea for ProtoFS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for ProtoFS! We welcome ideas to improve file management, performance, platform support, and user experience.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary & Motivation
      description: Is your feature request related to a problem or specific use case? Please describe.
      placeholder: A clear and concise description of what problem this feature solves...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Design
      description: Describe how you envision this feature working or looking.
      placeholder: Describe the solution you'd like...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Describe any alternative approaches...
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Target Component / Area
      description: Which area of ProtoFS does this feature primarily affect?
      options:
        - UI / Frontend (React + Tailwind)
        - Core Engine / VFS (crates/protofs-core)
        - MTProto Client & Sync
        - WebDAV / OS Drive Mounting
        - Android App
        - CLI Tools (protofs-cli)
        - Proxy & Networking
        - Encryption & Vault
        - Other
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or other context about the feature request.
    validations:
      required: false
