name: Build Android APK
# Dedicated workflow to build and package the ProtoFS Android APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Type (release or debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Compile Frontend Distribution
        working-directory: frontend
        run: npm run build

      - name: Build Android APK via Gradle
        working-directory: crates/protofs-tauri/gen/android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            gradle assembleRelease || gradle assembleDebug
          fi

      - name: Find and Collect APK Artifacts
        run: |
          mkdir -p dist-apk
          find crates/protofs-tauri/gen/android -name "*.apk" -exec cp {} dist-apk/ \;
          ls -lh dist-apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protofs-android-apk
          path: dist-apk/*
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist-apk/*
