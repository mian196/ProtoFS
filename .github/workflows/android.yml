name: Build Android APK
# Builds ProtoFS Android APK using the Tauri 2.0 Android build pipeline

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Type (release or debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and Build Tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend Distribution
        working-directory: frontend
        run: npm run build

      - name: Initialize Tauri Android Project
        working-directory: frontend
        run: npm run tauri -- android init
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Build Android APK (Release)
        if: github.event.inputs.build_mode != 'debug'
        working-directory: frontend
        run: npm run tauri -- android build --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Build Android APK (Debug)
        if: github.event.inputs.build_mode == 'debug'
        working-directory: frontend
        run: npm run tauri -- android build --debug --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Collect APK Artifacts
        run: |
          mkdir -p dist-apk
          find . -name "*.apk" -not -path "*/node_modules/*" -exec cp {} dist-apk/ \;
          echo "--- APKs found ---"
          ls -lh dist-apk/ || echo "No APKs found"

      - name: Upload Android APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protofs-android-apk
          path: dist-apk/
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist-apk/*
