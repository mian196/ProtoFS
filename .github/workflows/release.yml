name: Build and Release ProtoFS

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x86_64'
            os: windows-latest
            cli_bin: protofs-cli.exe
            gui_bin: protofs-tauri.exe
            archive_ext: zip
          - platform: 'linux-x86_64'
            os: ubuntu-latest
            cli_bin: protofs-cli
            gui_bin: protofs-tauri
            archive_ext: tar.gz
          - platform: 'macos-x86_64'
            os: macos-latest
            cli_bin: protofs-cli
            gui_bin: protofs-tauri
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Build Release Binaries (CLI & GUI)
        run: |
          cargo build --release -p protofs-cli
          cargo build --release -p protofs-tauri

      - name: Package CLI Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist-cli" -Force
          Copy-Item "target/release/${{ matrix.cli_bin }}" -Destination "dist-cli/"
          Compress-Archive -Path "dist-cli/*" -DestinationPath "protofs-cli-${{ matrix.platform }}.zip"

      - name: Package CLI Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-cli
          cp "target/release/${{ matrix.cli_bin }}" dist-cli/
          tar -czf "protofs-cli-${{ matrix.platform }}.tar.gz" -C dist-cli "${{ matrix.cli_bin }}"

      - name: Package Portable GUI Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist-gui" -Force
          Copy-Item "target/release/${{ matrix.gui_bin }}" -Destination "dist-gui/"
          Compress-Archive -Path "dist-gui/*" -DestinationPath "protofs-portable-${{ matrix.platform }}.zip"

      - name: Package Portable GUI Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-gui
          cp "target/release/${{ matrix.gui_bin }}" dist-gui/
          tar -czf "protofs-portable-${{ matrix.platform }}.tar.gz" -C dist-gui "${{ matrix.gui_bin }}"

      - name: Build Tauri Installers
        run: npx --prefix frontend tauri build

      - name: Collect Installer Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist-installers" -Force
          Get-ChildItem -Path "target/release/bundle" -Recurse -Include *.exe, *.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist-installers/"
          }

      - name: Collect Installer Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-installers
          find target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist-installers/ \;

      - name: Collect Installer Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-installers
          find target/release/bundle -type f -name "*.dmg" -exec cp {} dist-installers/ \;

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protofs-cli-${{ matrix.platform }}
          path: protofs-cli-${{ matrix.platform }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload Portable GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protofs-portable-${{ matrix.platform }}
          path: protofs-portable-${{ matrix.platform }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protofs-installers-${{ matrix.platform }}
          path: dist-installers/*
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and Build Tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend Distribution
        working-directory: frontend
        run: npm run build

      - name: Initialize Tauri Android Project
        run: ./frontend/node_modules/.bin/tauri android init
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Patch Android build.gradle.kts (Robust)
        run: |
          python3 -c '
          import os
          gradle_path = "crates/protofs-tauri/gen/android/app/build.gradle.kts"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r") as f:
                  content = f.read()
              if "getByName(\"debug\")" not in content:
                  print("Injecting debug build type...")
                  # Find the buildTypes block
                  if "buildTypes {" in content:
                      content = content.replace("buildTypes {", "buildTypes {\n        getByName(\"debug\") {\n            isDebuggable = true\n            isMinifyEnabled = false\n        }")
                  elif "android {" in content:
                      # If no buildTypes, inject it inside android block
                      content = content.replace("android {", "android {\n    buildTypes {\n        getByName(\"debug\") {\n            isDebuggable = true\n            isMinifyEnabled = false\n        }\n    }")
                  with open(gradle_path, "w") as f:
                      f.write(content)
                  print("Patch applied successfully.")
              else:
                  print("Debug build type already present.")
          else:
              print("File not found: " + gradle_path)
          '

      - name: Build Android Debug APK
        run: ./frontend/node_modules/.bin/tauri android build --debug --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Collect APK Artifacts
        run: |
          mkdir -p dist-apk
          find . -name "*.apk" -not -path "*/node_modules/*" -exec cp {} dist-apk/ \;
          echo "--- APKs found ---"
          ls -lh dist-apk/ || echo "No APKs found"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protofs-android-apk
          path: dist-apk/
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [build-and-test, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifact Files
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \;
          ls -lh release-dist/

      - name: Determine Tag or Release Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="manual-${GITHUB_SHA::8}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ProtoFS ${{ steps.release_info.outputs.tag_name }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: release-dist/*
