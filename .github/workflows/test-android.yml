name: Test Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-build-test
      - 'test/**'
    paths:
      - 'crates/**'
      - 'frontend/**'
      - 'package.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-android.yml'

jobs:
  build-apk:
    name: Build Android APK (CI Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & SDK Build Tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend Distribution
        working-directory: frontend
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x crates/protofs-tauri/gen/android/gradlew

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Android Debug APK
        run: npm run android:build:debug -- --verbose
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Collect Output APK Artifact
        run: |
          mkdir -p dist-apk
          find crates/protofs-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} "dist-apk/ProtoFS_v${{ steps.app_version.outputs.version }}_android.apk" \; || find . -name "*.apk" -not -path "*/node_modules/*" -exec cp {} "dist-apk/ProtoFS_v${{ steps.app_version.outputs.version }}_android.apk" \;
          echo "=== Built APK Artifacts ==="
          ls -lh dist-apk/

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protofs-android-test-apk
          path: dist-apk/*.apk
          if-no-files-found: error
