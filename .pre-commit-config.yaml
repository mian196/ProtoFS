# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Exclude autogenerated Tauri files that are tracked in git
exclude: '^crates/protofs-tauri/gen/'

repos:
  # Standard file and syntax sanity checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # Exclude JSONC files that allow comments
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=2000']

  # Local workspace quality hooks (Rust + Frontend)
  - repo: local
    hooks:
      # Rust formatting
      - id: cargo-fmt
        name: Cargo Fmt
        description: Check Rust formatting with rustfmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      # Rust clippy linting
      - id: cargo-clippy
        name: Cargo Clippy
        description: Run Clippy lints across the workspace
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Frontend TypeScript and ESLint
      - id: frontend-lint
        name: Frontend Lint & Typecheck
        description: Run ESLint and TypeScript checks on frontend
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
