<!doctype html>
<html lang="en" data-theme="dark" data-palette="telegram">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProtoFS: Unlimited Cloud Storage</title>
    <meta name="description" content="Open-source, cross-platform file explorer powered by Telegram MTProto with client-side AEAD encryption and SQLite cache." />
    <style>
      :root {
        --bg-app-dark: #0f141c;
        --accent-blue: #2563eb;
        --text-subtle: #94a3b8;
      }
      html, body {
        background-color: var(--bg-app-dark);
        color: #f0f4f8;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #app {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .initial-splash {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-app-dark);
        gap: 16px;
        user-select: none;
      }
      .initial-splash-logo {
        width: 44px;
        height: 44px;
        color: var(--accent-blue);
        animation: protofs-pulse 1.6s ease-in-out infinite;
      }
      .initial-splash-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent-blue);
        border-radius: 50%;
        animation: protofs-spin 0.75s linear infinite;
      }
      .initial-splash-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #f0f4f8;
      }
      @keyframes protofs-pulse {
        0%, 100% { opacity: 0.75; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @keyframes protofs-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="initial-splash">
        <svg class="initial-splash-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
        </svg>
        <div class="initial-splash-title">ProtoFS Cloud Storage</div>
        <div class="initial-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
